# docker-compose.yml

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=DFIRplatform!1
    ports: ["9200:9200"]
    volumes: ["opensearch_data:/usr/share/opensearch/data"]

  neo4j:
    image: neo4j:5.15
    environment:
      - NEO4J_AUTH=neo4j/DFIRplatform1
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dfir
      POSTGRES_USER: dfir
      POSTGRES_PASSWORD: DFIRplatform1
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dfir
      MINIO_ROOT_PASSWORD: DFIRplatform1
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  platform:
    build: .
    depends_on: [opensearch, neo4j, postgres, minio]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      NEO4J_URL: bolt://neo4j:7687
      POSTGRES_URL: postgresql://dfir:DFIRplatform1@postgres/dfir
      MINIO_URL: http://minio:9000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./evidence:/evidence
    ports: ["8080:8080"]

volumes:
  opensearch_data:
  neo4j_data:
  postgres_data:
  minio_data:
